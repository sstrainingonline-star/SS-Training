<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" role="img"><title>Teaching summary: Observe against criteria; Give one useful action; Allow a retry and recheck</title><rect width="1000" height="370" rx="24" fill="#0c1119"/><g font-family="Arial,sans-serif"><text x="40" y="52" fill="#b6d2ee" font-size="15" letter-spacing="3">SS TRAINING / MODULE 07</text><text x="40" y="100" fill="white" font-size="29">Feedback and fair assessment</text><rect x="40" y="145" width="290" height="175" rx="18" fill="#172536" stroke="#49647f"/><text x="62" y="190" fill="#b6d2ee" font-size="28">01</text><text x="62" y="240" fill="white" font-size="20"><tspan x="62" dy="0">Observe against</tspan><tspan x="62" dy="29">criteria</tspan></text><rect x="350" y="145" width="290" height="175" rx="18" fill="#172536" stroke="#49647f"/><text x="372" y="190" fill="#b6d2ee" font-size="28">02</text><text x="372" y="240" fill="white" font-size="20"><tspan x="372" dy="0">Give one useful action</tspan></text><rect x="660" y="145" width="290" height="175" rx="18" fill="#172536" stroke="#49647f"/><text x="682" y="190" fill="#b6d2ee" font-size="28">03</text><text x="682" y="240" fill="white" font-size="20"><tspan x="682" dy="0">Allow a retry and</tspan><tspan x="682" dy="29">recheck</tspan></text></g></svg>