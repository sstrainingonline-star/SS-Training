<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310"><title>Safety summary: Prevent ignition and fuel build-up; Maintain clear escape routes; Raise alarm and evacuate</title><rect width="1000" height="310" rx="20" fill="#0c1119"/><g font-family="Arial,sans-serif"><text x="30" y="53" fill="white" font-size="24">SS TRAINING / HEALTH AND SAFETY / 07</text><rect x="30" y="100" width="300" height="170" rx="16" fill="#172536" stroke="#6c879f"/><text x="48" y="140" fill="#a7c8e5" font-size="24">01</text><text x="48" y="190" fill="white" font-size="19"><tspan x="48" dy="0">Prevent ignition and</tspan><tspan x="48" dy="25">fuel build-up</tspan></text><rect x="350" y="100" width="300" height="170" rx="16" fill="#172536" stroke="#6c879f"/><text x="368" y="140" fill="#a7c8e5" font-size="24">02</text><text x="368" y="190" fill="white" font-size="19"><tspan x="368" dy="0">Maintain clear escape</tspan><tspan x="368" dy="25">routes</tspan></text><rect x="670" y="100" width="300" height="170" rx="16" fill="#172536" stroke="#6c879f"/><text x="688" y="140" fill="#a7c8e5" font-size="24">03</text><text x="688" y="190" fill="white" font-size="19"><tspan x="688" dy="0">Raise alarm and</tspan><tspan x="688" dy="25">evacuate</tspan></text></g></svg>